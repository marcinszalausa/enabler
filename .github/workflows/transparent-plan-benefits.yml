name: Transparent plan benefits
on:
  push:
    branches: [ux/transparent-plan-benefits]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/paid-plans.ts src/app/_landing/public-pricing.tsx 'src/app/[locale]/pricing/page.tsx' src/i18n/messages/en.ts
      - run: node --experimental-strip-types --test tests/simple-paid-plans.test.ts tests/plan-value.test.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
      - run: npm install --prefix /tmp/tier-browser --no-save --package-lock=false playwright@1.56.1
      - run: /tmp/tier-browser/node_modules/.bin/playwright install --with-deps chrome
      - run: node scripts/check-pricing-catalog.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/tier-browser/node_modules/playwright
          BROWSER_CHANNEL: chrome
