name: Choose and post checks
on:
  push:
    branches: [feat/choose-favorite]
  pull_request:
permissions:
  contents: read
jobs:
  choose-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/ad-choice.test.ts
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/ad-choice.ts 'src/app/[locale]/dashboard/products/[id]/ad-gallery.tsx' 'src/app/[locale]/dashboard/products/[id]/generation-block.tsx' 'src/app/[locale]/dashboard/products/[id]/publish-dialog.tsx' 'src/app/[locale]/dashboard/products/[id]/page.tsx' 'src/app/[locale]/dashboard/publishing/chosen-ad-resume.tsx' 'src/app/[locale]/dashboard/publishing/page.tsx' src/i18n/messages/*.ts
