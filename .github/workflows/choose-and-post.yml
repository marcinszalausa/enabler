name: Choose and post checks
on:
  push:
    branches: [feat/choose-favorite]
  pull_request:
permissions:
  contents: read
jobs:
  choose-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/ad-choice.test.ts
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/ad-choice.ts 'src/app/[locale]/dashboard/use-ad-choice.ts' 'src/app/[locale]/dashboard/products/[id]/ad-gallery.tsx' 'src/app/[locale]/dashboard/products/[id]/generation-block.tsx' 'src/app/[locale]/dashboard/products/[id]/publish-dialog.tsx' 'src/app/[locale]/dashboard/products/[id]/page.tsx' 'src/app/[locale]/dashboard/publishing/chosen-ad-resume.tsx' 'src/app/[locale]/dashboard/publishing/page.tsx' 'src/app/[locale]/dashboard/publishing/publishing-view.tsx' src/i18n/messages/*.ts
      - run: npm install --prefix /tmp/gooidy-choose-browser --no-package-lock playwright@1.56.1
      - run: /tmp/gooidy-choose-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/check-choose-and-post.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/gooidy-choose-browser/node_modules/playwright
