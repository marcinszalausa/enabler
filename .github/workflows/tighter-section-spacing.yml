name: Tighter section spacing
on:
  push:
    branches: [ux/tighter-section-spacing]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/app/_landing/platform-marks.tsx src/app/_landing/studio-home.tsx src/app/_landing/chrome.tsx
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
      - run: npm install --prefix /tmp/gooidy-browser --no-save --package-lock=false playwright@1.56.1
      - run: /tmp/gooidy-browser/node_modules/.bin/playwright install --with-deps chrome
      - name: Check responsive homepage and pricing
        run: |
          mkdir -p /tmp/studio-review
          npm run start >/tmp/minimal-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-premium-homepage.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tighter-section-spacing
          path: /tmp/studio-review/hero-390.png
          retention-days: 3
