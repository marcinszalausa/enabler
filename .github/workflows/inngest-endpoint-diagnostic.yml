name: Shopify connection readiness diagnostic
on:
  push:
    branches: [ops/inngest-endpoint-diagnostic]
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public production endpoint without credentials
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          request=urllib.request.Request("https://gooidy.com/api/shopify/connect", data=b"", method="POST", headers={"User-Agent":"Gooidy-Setup-Diagnostic","Accept":"application/json","Content-Type":"application/x-www-form-urlencoded"})
          try:
              response=opener.open(request,timeout=30)
          except urllib.error.HTTPError as error:
              response=error
          except Exception as error:
              print(json.dumps({"reachable":False,"error_type":type(error).__name__}))
              raise SystemExit(0)
          body=response.read(65536).decode("utf-8","replace")
          result={"reachable":True,"http_status":response.status,"content_type":response.headers.get("Content-Type","").split(";")[0]}
          try:
              data=json.loads(body)
              if isinstance(data,dict):
                  result["catalog_not_configured"]=data.get("code")=="CATALOG_WORKERS_NOT_CONFIGURED"
                  allowed=["CATALOG_INGESTION_ENABLED","CATALOG_ENCRYPTION_KEY","INNGEST_SIGNING_KEY"]
                  errors=data.get("configuration_errors")
                  reasons=["missing","wrong_length","not_hexadecimal","must_be_true","blank"]
                  if isinstance(errors,dict):result["configuration_errors"]={name:reason for name,reason in errors.items() if name in allowed and reason in reasons}
                  supplied=data.get("missing_or_invalid_settings")
                  if isinstance(supplied,list):result["missing_or_invalid_settings"]=[name for name in supplied if name in allowed]
                  for key in ["has_event_key","has_signing_key","authentication_succeeded"]:
                      if isinstance(data.get(key),bool):result[key]=data[key]
          except Exception:
              result["platform_error"]=any(marker in body for marker in ["FUNCTION_INVOCATION_FAILED","DEPLOYMENT_NOT_FOUND"])
          print(json.dumps(result))
          PY
      - name: Read public Soft Mila store address
        run: |
          python - <<'PY'
          import urllib.request,re,json
          try:
              response=urllib.request.urlopen("https://www.softmila.com/",timeout=25)
              body=response.read(2097152).decode("utf-8","replace")
              match=re.search(r"""Shopify[.]shop\s*=\s*["']([a-z0-9-]+[.]myshopify[.]com)""",body,re.I)
              print(json.dumps({"public_shop_domain":match.group(1).lower() if match else None}))
          except Exception as error:
              print(json.dumps({"public_shop_domain":None,"error_type":type(error).__name__}))
          PY
