name: Premium store connections
on:
  push:
    branches: [feat/premium-store-connections]
  pull_request:
    paths: ['src/lib/catalog/**', 'src/inngest/platform-stores.ts', 'src/app/api/catalog/**', 'src/app/[locale]/dashboard/stores/**', 'supabase/*/*premium_store*', 'tests/premium-stores*']
permissions:
  contents: read
concurrency:
  group: premium-stores-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: premium_stores
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/premium-stores.test.ts tests/shopify-security.test.ts tests/catalog-foundation.test.ts
      - run: node --test tests/shopify-callback.test.mjs tests/catalog-training.test.mjs
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/stores src/lib/catalog src/lib/shopify src/inngest/platform-stores.ts src/inngest/shopify.ts src/app/api/catalog src/app/api/shopify 'src/app/[locale]/dashboard/stores'
      - run: bash scripts/test-premium-stores.sh
        env:
          CATALOG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/premium_stores
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://catalog-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          CATALOG_INGESTION_ENABLED: 'false'
          SHOPIFY_CONNECT_ENABLED: 'false'
