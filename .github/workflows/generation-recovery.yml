name: Generation recovery checks
on:
  push:
    branches: [fix/generation-recovery]
  pull_request:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read installed worker guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['after.md', 'route-handlers.md']:
            for p in Path('node_modules/next/dist/docs').rglob(name):
              print(f'GUIDE {p}\n{p.read_text()}')
          PY
      - name: All security and video ownership tests
        run: node --experimental-strip-types --test tests/*.test.ts
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/pipeline.ts src/lib/video.tsx src/lib/video-job-state.ts
  recovery-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recovery_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations and test recovery and concurrent settlement
        env:
          CREDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recovery_tests
        run: bash scripts/test-credits.sh && bash scripts/test-generation-ledger.sh && bash scripts/test-generation-recovery.sh
