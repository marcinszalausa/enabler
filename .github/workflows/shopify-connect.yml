name: Shopify dashboard connection
on:
  push:
    branches: [feat/dashboard-shopify-connect]
permissions:
  contents: read
jobs:
  shopify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed Next guidance
        run: find node_modules/next/dist/docs -type f \( -name route-handlers.md -o -name page.md -o -name server-actions-and-mutations.md \) | xargs cat
      - name: Generate migration
        run: npx --yes supabase migration new dashboard_shopify_connect && ls supabase/migrations/*dashboard_shopify_connect.sql
      - name: Current Supabase changelog
        run: curl --fail --silent --show-error https://supabase.com/changelog.md | head -c 15000
