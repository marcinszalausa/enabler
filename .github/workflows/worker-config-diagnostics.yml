name: Worker configuration diagnostics
on:
  push:
    branches: [fix/inngest-config-diagnostic]
  pull_request:
    paths: ['src/lib/catalog/security.ts','src/app/api/inngest/route.ts','tests/catalog-worker-config.test.ts','.github/workflows/worker-config-diagnostics.yml']
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test tests/catalog-worker-config.test.ts tests/catalog-foundation.test.ts
