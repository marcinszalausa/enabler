name: Public fetch security checks
on:
  push:
    branches: [fix/public-url-fetching]
  pull_request:
permissions:
  contents: read
jobs:
  public-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed server runtime guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('node_modules/next/dist/docs').rglob('edge.md'):
              print(f'GUIDE {p}\n{p.read_text()}')
          PY
      - name: All security and regression tests, including real local socket/TLS checks
        run: node --experimental-strip-types --test tests/*.test.ts
      - run: npx next typegen && npx tsc --noEmit
      - name: Lint public-fetch changes
        run: npx eslint src/lib/public-fetch.ts src/lib/scrape.ts src/lib/brand-kit.ts src/lib/pipeline.ts src/lib/video.tsx src/lib/ai/fal.ts src/lib/ai/claude.ts src/lib/ad-text.ts src/lib/social/zernio.ts
