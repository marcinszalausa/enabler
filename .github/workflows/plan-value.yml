name: Plan value and workflow checks
on:
  push:
    branches: [enhance/plan-value]
  pull_request:
permissions:
  contents: read
concurrency:
  group: plan-value-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan-value:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read installed navigation and metadata guides
        run: find node_modules/next/dist/docs/01-app -type f \( -name link.md -o -iname '*metadata*' -o -name generate-static-params.md \) | xargs cat
      - name: Read installed forms and server guidance
        run: find node_modules/next/dist/docs -type f \( -name forms.md -o -name updating-data.md -o -name server-actions-and-mutations.md \) | xargs cat
      - name: Supabase changelog
        run: curl --fail --silent --show-error https://supabase.com/changelog.md | head -c 20000
      - run: npx next typegen && npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/plan-value.test.ts
      - run: npx eslint src/lib/plan-value.ts src/lib/public-information.ts src/app/_landing/public-pricing.tsx 'src/app/[locale]/dashboard/insights' 'src/app/[locale]/dashboard/publishing/planner' 'src/app/[locale]/dashboard/publishing/page.tsx' 'src/app/[locale]/pricing'
      - run: npm install --prefix /tmp/plan-browser --no-package-lock playwright@1.56.1
      - run: /tmp/plan-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/plan-browser/node_modules/playwright node scripts/check-plan-value.mjs
