name: Catalog training foundation
on:
  push:
    branches: [feat/catalog-training-foundation]
  pull_request:
    paths: ['src/lib/catalog/**', 'src/inngest/**', 'src/app/api/catalog/**', 'src/app/api/inngest/**', 'supabase/*/*catalog*', 'tests/catalog*']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed Next route guidance
        run: find node_modules/next/dist/docs -type f -name route-handlers.md | xargs cat
      - run: node --experimental-strip-types --test tests/catalog-foundation.test.ts
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/catalog src/inngest src/app/api/catalog src/app/api/inngest
      - run: bash scripts/test-catalog-foundation.sh
        env:
          CATALOG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalog_test
