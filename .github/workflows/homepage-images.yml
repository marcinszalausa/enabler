name: Homepage image diagnostics
on:
  push:
    branches: [fix/homepage-image-loading]
permissions:
  contents: read
jobs:
  image-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/homepage-browser --no-package-lock playwright@1.56.1
      - run: /tmp/homepage-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/probe-homepage-images.mjs
