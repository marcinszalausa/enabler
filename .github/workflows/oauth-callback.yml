name: OAuth callback checks
on:
  push:
    branches: [fix/social-oauth-state]
  pull_request:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read installed cookie API and provider redirect contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          for p in Path('node_modules/next/dist/docs').rglob('cookies.*'):
              if p.is_file(): print(f'GUIDE {p}\n{p.read_text()}')
          for url in ['https://docs.zernio.com/llms-mdx/guides/connecting-accounts']:
              print('PROVIDER DOC', url)
              print(urlopen(url, timeout=20).read().decode()[:80000])
          PY
      - run: npx --yes supabase@2.81.3 migration new social_connect_state
