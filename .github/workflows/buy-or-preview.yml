name: Buy or preview checks
on:
  push:
    branches: [enhance/buy-or-preview]
  pull_request:
permissions:
  contents: read
concurrency:
  group: buy-or-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  buy-or-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read installed navigation and metadata guides
        run: find node_modules/next/dist/docs/01-app -type f \( -name link.md -o -iname '*metadata*' -o -name generate-static-params.md \) | xargs cat
      - name: Read installed forms and server guidance
        run: find node_modules/next/dist/docs -type f \( -name forms.md -o -name updating-data.md -o -name server-actions-and-mutations.md \) | xargs cat
      - name: Supabase changelog
        run: curl --fail --silent --show-error https://supabase.com/changelog.md | head -c 20000
      - run: npx next typegen && npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/simple-paid-plans.test.ts tests/onboarding.test.ts tests/plan-value.test.ts
      - run: npx eslint src/app/_landing/information-page.tsx 'src/app/[locale]/checkout/page.tsx' 'src/app/[locale]/pricing/page.tsx' src/lib/paid-plans.ts src/lib/onboarding.ts src/lib/plan-value.ts src/lib/public-information.ts src/app/_landing/public-pricing.tsx 'src/app/[locale]/start/start-flow.tsx' 'src/app/[locale]/dashboard/setup/page.tsx' 'src/app/[locale]/dashboard/actions.ts' 'src/app/[locale]/dashboard/product-url-form.tsx' 'src/app/[locale]/dashboard/products/[id]/page.tsx' 'src/app/[locale]/dashboard/insights/page.tsx' 'src/app/[locale]/dashboard/insights/growth-report.tsx'
      - run: npm install --prefix /tmp/simple-browser --no-package-lock playwright@1.56.1
      - run: /tmp/simple-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: PLAYWRIGHT_MODULE_PATH=/tmp/simple-browser/node_modules/playwright node scripts/check-pricing-catalog.mjs
