name: Tangible plan value
on:
  push:
    branches: [ux/tangible-plan-value]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/credit-examples.ts src/lib/credit-example-copy.ts src/app/_landing/public-pricing.tsx src/app/_landing/studio-home.tsx src/app/_landing/studio-copy.ts
      - run: node --experimental-strip-types --test tests/simple-paid-plans.test.ts tests/credit-pricing.test.ts
      - run: npx --yes tsx@4.20.6 --test tests/credit-examples.test.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
      - run: npm install --prefix /tmp/value-browser --no-save --package-lock=false playwright@1.56.1
      - run: /tmp/value-browser/node_modules/.bin/playwright install --with-deps chrome
      - run: node scripts/check-pricing-catalog.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/value-browser/node_modules/playwright
          BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tangible-plan-value
          path: /tmp/premium-pricing/*
          retention-days: 3
