name: Growth action plan and report tools
on:
  push:
    branches: [enhance/growth-action-plan]
permissions:
  contents: read
concurrency:
  group: growth-action-plan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan-inclusions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed navigation guidance
        run: find node_modules/next/dist/docs/01-app -type f -name link.md | xargs cat
      - name: Current Supabase server-auth guidance
        run: |
          curl --fail --silent --show-error https://supabase.com/changelog.md | head -c 12000
          curl --fail --silent --show-error https://supabase.com/docs/guides/auth/server-side/nextjs.md | head -c 22000
      - run: npx next typegen && npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/growth-testing.test.ts tests/plan-value.test.ts tests/simple-paid-plans.test.ts
      - run: npx eslint src/lib/growth-testing.ts src/lib/plan-value.ts src/lib/paid-plans.ts src/lib/public-information.ts src/app/_landing/public-pricing.tsx 'src/app/[locale]/dashboard/insights/'
      - run: npm install --prefix /tmp/plan-inclusions --no-package-lock playwright@1.56.1
      - run: /tmp/plan-inclusions/node_modules/.bin/playwright install --with-deps chromium
      - name: Inherited plan lists, disabled purchases and optional free preview
        run: PLAYWRIGHT_MODULE_PATH=/tmp/plan-inclusions/node_modules/playwright node scripts/check-pricing-catalog.mjs
      - name: Report filters, safe downloads and Growth action plan
        run: PLAYWRIGHT_MODULE_PATH=/tmp/plan-inclusions/node_modules/playwright node scripts/check-plan-value.mjs
