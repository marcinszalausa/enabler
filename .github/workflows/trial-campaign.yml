name: Trial campaign checks
on:
  push:
    branches: [feat/trial-campaign]
  pull_request:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read installed framework guides and create migration with Supabase CLI
        run: |
          npm ci
          find node_modules/next/dist/docs -iname '*client*' -type f -exec sh -c 'head -c 18000 "$1"' sh {} \;
          curl -fsSL https://supabase.com/changelog.md -o /tmp/changelog.md
          head -c 22000 /tmp/changelog.md
          npx --yes supabase@2.81.3 migration new trial_campaign_safeguards
          ls supabase/migrations/*trial_campaign_safeguards.sql
