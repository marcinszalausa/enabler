name: Pre-launch legal and privacy
on:
  push:
    branches: [legal/us-prelaunch, main]
  pull_request:
permissions:
  contents: read
jobs:
  legal-privacy:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed route and rendering guidance
        run: find node_modules/next/dist/docs/01-app -name route.md -o -name link.md -o -name metadata.md | xargs cat
      - run: npx next typegen && npx tsc --noEmit
      - run: |
          if test -f scripts/check-legal-privacy.mjs; then
            node --experimental-strip-types --test tests/legal-policy.test.ts
            npx eslint src/app/_landing/legal.tsx src/app/_landing/chrome.tsx src/lib/legal-policy.ts src/app/_landing/policy-content.tsx 'src/app/[locale]/terms/page.tsx' 'src/app/[locale]/privacy/page.tsx' 'src/app/[locale]/policies/[document]/page.tsx' src/app/api/billing/checkout/route.ts
            npm install --prefix /tmp/legal-browser --no-package-lock playwright@1.56.1
            /tmp/legal-browser/node_modules/.bin/playwright install --with-deps chromium
            PLAYWRIGHT_MODULE_PATH=/tmp/legal-browser/node_modules/playwright node scripts/check-legal-privacy.mjs
          fi
  production-legal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-live-legal.mjs
        env:
          GH_TOKEN: ${{ github.token }}
