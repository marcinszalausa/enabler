name: Curated homepage
on:
  pull_request:
  push:
    branches: [perf/curated-homepage]
jobs:
  curated-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/homepage-media.test.ts
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/homepage-media.ts src/app/_landing/ad-image.tsx src/app/_landing/phone-feed.tsx src/app/_landing/before-after.tsx 'src/app/[locale]/page.tsx' next.config.ts
