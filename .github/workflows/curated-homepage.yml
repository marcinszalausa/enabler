name: Curated homepage media
on:
  push:
    branches: [perf/curated-homepage]
permissions:
  contents: read
jobs:
  media-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export selected public images and video once
        run: node scripts/export-homepage-media.mjs
