name: Phase one verification
on:
  push:
    branches: [feat/phase-one]
permissions:
  contents: read
jobs:
  phase-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installed Next route and server guidance
        run: |
          find node_modules/next/dist/docs -type f | head -35
          find node_modules/next/dist/docs -type f \( -iname '*route-handlers*' -o -iname '*server-and-client-components*' \) -exec cat {} +
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/catalog/inventory*.ts src/lib/catalog/paid-ad-pause.ts src/inngest/inventory.ts src/inngest/stock-pauses.ts src/inngest/shopify.ts src/app/api/shopify/webhooks/route.ts
