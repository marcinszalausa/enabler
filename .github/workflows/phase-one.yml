name: Phase one verification
on:
  push:
    branches: [feat/phase-one]
  pull_request:
    paths: ['src/lib/catalog/**','src/inngest/**','src/app/api/catalog/**','src/app/api/shopify/**','src/app/**/stores/**','supabase/*/*phase_one*','tests/phase-one*','scripts/check-phase-one*','.github/workflows/phase-one.yml']
permissions:
  contents: read
jobs:
  phase-one:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase_one
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src/lib/catalog src/inngest src/app/api/catalog src/app/api/shopify 'src/app/[locale]/dashboard/stores'
      - run: node --experimental-strip-types --test tests/phase-one.test.ts
      - run: node --test tests/catalog-training.test.mjs tests/catalog-photo-review.test.mjs tests/phase-one-routes.test.mjs
      - run: bash scripts/test-phase-one.sh
        env:
          CATALOG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phase_one
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://catalog-test.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture

      - run: |
          npm install --prefix /tmp/gooidy-browser --no-save --package-lock=false playwright@1.56.1
          /tmp/gooidy-browser/node_modules/.bin/playwright install --with-deps chrome
      - name: Phone and desktop workflow checks
        run: node scripts/check-phase-one.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/gooidy-browser/node_modules/playwright
          BROWSER_CHANNEL: chrome
      - name: Save workflow screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-one-review
          path: /tmp/phase-one-review/*
          retention-days: 3
